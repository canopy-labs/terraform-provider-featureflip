# Local-only override consumed by scripts/local-api.sh via `docker compose -f
# .../docker-compose.yml -f local-api.override.yml`. It never touches the
# feature-flagger checkout itself.
#
# Why this exists: the public /api/v1 surface (including GET /orgs/{org},
# which this provider's Configure now hits as a fail-fast check, and which the
# Step 10 smoke test curls directly) is gated behind the
# `Features:PublicManagementApi` config flag. That flag defaults to false in
# apps/management-api/src/Management.Api/appsettings*.json and is never
# flipped on by docker-compose.yml, so every /api/v1/* request 404s
# (PublicApiAvailabilityMiddleware) until it's enabled. This override sets it
# to true for the compose project started by local-api.sh only.
#
# Webhooks__Enabled does the same for the outbound-webhook subsystem, which
# ships off by default upstream: with it off, every /api/v1/orgs/{org}/webhooks
# route answers 404, so the featureflip_webhook* acceptance tests would fail.
services:
  management-api:
    environment:
      - Features__PublicManagementApi=true
      - Webhooks__Enabled=true
      # Flag ownership, permanent flags and expiry (incl. the project default
      # lifetime) are config-gated too and off by default; the lifecycle
      # acceptance tests need them on.
      - Features__FlagOwnership=true
      - Features__FlagPermanence=true
      - Features__FlagExpiration=true
      # Critical environments (required change reasons) are on in production for
      # every organization; the fallback gate used here (no Featureflip SDK key)
      # defaults to off. On a Business org a new project's production environment
      # then starts with requireChangeReason, as it does in production, so the
      # suite sends a change reason (seed.sh writes FEATUREFLIP_CHANGE_REASON).
      - Features__CriticalEnvironments=true
      # Rollout ramps have launched, but the fallback gate defaults to off; the
      # featureflip_rollout_ramp acceptance test needs it on.
      - Features__RolloutRamps=true
